appId: dev.easyserver.client
productName: EasyServer
electronVersion: 33.2.1
npmRebuild: false
asar: true
publish: null
directories:
  output: ../../release/client
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc signed (required on Apple silicon). Not notarized: first open with right-click > Open.
  identity: "-"
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what the built-in updater installs from.
    - target: zip
      arch: [arm64, x64]
  artifactName: EasyServer-${version}-mac-${arch}.${ext}
dmg:
  artifactName: EasyServer-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: EasyServer-Setup-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Network
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: EasyServer-${version}-linux-${arch}.${ext}
  maintainer: EasyServer
