<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>EasyServer Server</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { overflow: hidden; background: #fff; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
      @media (prefers-color-scheme: dark) { body { background: #1e1e1f; } }
      body.mac-vibrancy { background: transparent; }
      #root { display: flex; }
      input, textarea, [data-selectable] { user-select: text; -webkit-user-select: text; }
      /* Electron window dragging on empty chrome areas */
      [data-drag="1"] { -webkit-app-region: drag; }
      [data-nodrag="1"], [data-drag="1"] [role="button"], [data-drag="1"] button, [data-drag="1"] input { -webkit-app-region: no-drag; }
      /* Sheets blur the app behind them */
      [data-blur="1"] { backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); }
      @media (prefers-reduced-transparency: reduce) { [data-blur="1"] { backdrop-filter: none; -webkit-backdrop-filter: none; } }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(127,127,127,.35); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
