# Builds every download and publishes it as a GitHub Release, which is also the update feed:
#   macOS DMGs + update zips (Apple silicon and Intel), Windows installers, Linux AppImage/deb,
#   the `easyserver` CLI for macOS, Linux and Windows, and latest.json with SHA-512 checksums.
# Push a tag like v1.2.0 to release. Supabase settings come from supabase.public.json
# (publishable key only); add SUPABASE_URL / SUPABASE_ANON_KEY secrets to override.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon runner; builds arm64 and x64
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs ${{ github.ref_name }}
      - run: node scripts/test/run.mjs
      - run: node scripts/package.mjs client ${{ matrix.flag }}
      - run: node scripts/package.mjs server ${{ matrix.flag }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error

  cli:
    runs-on: macos-14   # so the macOS binaries can be codesigned (ad-hoc) after cross-compiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs ${{ github.ref_name }}
      - run: node scripts/build-cli.mjs
      - run: for f in dist/cli/easyserver-macos-*; do codesign --force --sign - "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/cli/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Flatten and build the update feed
        run: |
          mkdir -p dist-release
          find out -type f -exec cp {} dist-release/ \;
          node scripts/make-latest.mjs dist-release ${{ github.ref_name }} ${{ github.repository }}
          ls -la dist-release
      - uses: softprops/action-gh-release@v2
        with:
          name: EasyServer ${{ github.ref_name }}
          files: dist-release/*
          generate_release_notes: true
